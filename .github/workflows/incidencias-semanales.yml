name: Cabina · incidencias semanales
on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: cabina-incidencias
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tools/incidencias.test.mjs
      - run: node tools/update-incidencias.mjs
      - name: Guardar consulta e histórico en GitHub Pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add visor-ferroviario/capas/incidencias.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Actualizar incidencias semanales de Cabina'
          git pull --rebase origin main
          git push origin HEAD:main
      # Los pushes con GITHUB_TOKEN no disparan el build de Pages por sí solos.
      - name: Solicitar publicación de los datos en GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
