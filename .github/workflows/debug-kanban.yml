# TEMPORAL: ejecuta solo la prueba del Centro de trabajo para depurar un fallo que solo ocurre en el CI. Se borra al arreglarlo.
name: Depurar kanban
on:
  push:
    branches: [claude/quirky-bardeen-nhap79]
permissions:
  contents: read
jobs:
  kanban:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm i --no-save --no-package-lock playwright@1.56.1 axe-core@4.13.0
          npx playwright install --with-deps chromium
      - run: node tools/check-kanban.mjs
      - run: node tools/check-kanban.mjs
