<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Icono de Color Studio. Misma construcción que el de Caesar III (roma-aeterna/icons):
       fondo a sangre con un degradado suave, anillo fino y un emblema central.
       Emblema: la «placa» de la app, el conjunto apilado en bandas proporcionales. -->
  <defs>
    <radialGradient id="g" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#2B2B2B"/>
      <stop offset="1" stop-color="#141414"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#g)"/>
  <circle cx="256" cy="256" r="216" fill="none" stroke="#FFFFFF" stroke-opacity=".16" stroke-width="4"/>
  <rect x="164" y="136" width="184" height="102" rx="8" fill="#ECE5D8"/>
  <rect x="164" y="248" width="184" height="62" rx="8" fill="#C2915F"/>
  <rect x="164" y="320" width="184" height="34" rx="8" fill="#647A96"/>
  <rect x="164" y="364" width="184" height="20" rx="8" fill="#B4513F"/>
</svg>
